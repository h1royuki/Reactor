name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Reactor.xcodeproj \
            -scheme Reactor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated)?|BUILD (SUCCEEDED|FAILED)" | grep -v "appintentsmetadataprocessor" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" -A3 build.log | head -100; exit 1; }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Reactor.app Payload/
          zip -qry Reactor.ipa Payload
          ls -lh Reactor.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Reactor-ipa
          path: Reactor.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Reactor.ipa \
            --target "${{ github.sha }}" \
            --title "Реактор (сборка ${{ github.run_number }})" \
            --notes "Неподписанный IPA. Установка: AltStore / SideStore / Sideloadly / TrollStore." \
            --latest
